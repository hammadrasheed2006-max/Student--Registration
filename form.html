<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Student Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="form-page">
    <main class="card content-card">
        <h1>Registration form</h1>
        <form id="registration-form" class="contact-form" action="thanks.html" method="post">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="nutech-id">Nutech ID</label>
            <input id="nutech-id" name="nutech-id" type="text" autocomplete="off" required>

            <label for="program">Program of study</label>
            <select id="program" name="program" required>
                <option value="" selected disabled>Select a program</option>
                <option value="computer-science">Computer Science</option>
                <option value="information-technology">INFORMATION TECHNOLOGY (IT)</option>
                <option value="cyber-security">Cyber Security</option>
                <option value="data-science">Data Science</option>
                <option value="artificial-intelligence">Artificial Intelligence (AI)</option>
                <option value="other">Other</option>
            </select>

            <button type="submit">Submit registration</button>
        </form>
        <a class="page-link" href="index.html">Home</a>
    </main>
    <script>
        document.getElementById("registration-form").addEventListener("submit", (event) => {
            event.preventDefault();
            window.location.assign("thanks.html");
        });
    </script>
</body>
</html>
